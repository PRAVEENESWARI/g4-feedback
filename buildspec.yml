version: 0.2
 
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-northeast-3 | docker login --username AWS --password-stdin 124355663661.dkr.ecr.ap-northeast-3.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t g4-feedback-ecs:feedbackservicev1 .
      - docker tag g4-feedback-ecs:feedbackservicev1 124355663661.dkr.ecr.ap-northeast-3.amazonaws.com/g4-feedback-ecs:feedbackservicev1
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push 124355663661.dkr.ecr.ap-northeast-3.amazonaws.com/g4-feedback-ecs
      - echo Writing image definitions file...
      - printf '[{"name":"message-container","imageUri":"%s"}]' 124355663661.dkr.ecr.ap-northeast-3.amazonaws.com/g4-feedback-ecs:feedbackservicev1 > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json